# push のたびに「型チェック」「lint」「単体テスト」「本番ビルド」「DB（RLS）のテスト」と、
# ローカルの Supabase に対する「画面を通した動作確認（E2E）」を自動で実行して、壊れていないか確認します。
# 結果は GitHub の Actions タブで見られます（Vercel への公開とは別です）。
name: Build check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # ブラウザにも配られる公開用の値だけを置いています（秘密の鍵は置かないこと）。
      NEXT_PUBLIC_SUPABASE_URL: https://fjkvpthkmozsdpwgnuep.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_T23rTti1eLXI3W-nLYWWXA_cqFHvVp6
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund 2>&1 | tee install.log
      - name: Type check
        run: npm run typecheck 2>&1 | tee typecheck.log
      - name: Lint
        run: npm run lint 2>&1 | tee lint.log
      - name: Unit tests
        run: npm test 2>&1 | tee test.log
      - name: Build
        run: npm run build 2>&1 | tee build.log
      - name: Show failure details
        if: failure()
        run: |
          # 失敗したときはログの最後を注釈として残し、Actions の画面からすぐ読めるようにする
          for f in install.log typecheck.log lint.log test.log build.log; do
            [ -s "$f" ] || continue
            body=$(tail -n 150 "$f" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN { ORS = "%0A" } { print }')
            echo "::error title=${f}::${body}"
          done

  # supabase/migrations と RLS のテスト（supabase/tests）を、素の PostgreSQL 16 で実行する
  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - name: SQL tests
        run: bash supabase/tests/run.sh 2>&1 | tee db-test.log
      - name: Show failure details
        if: failure()
        run: |
          body=$(tail -n 150 db-test.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN { ORS = "%0A" } { print }')
          echo "::error title=db-test.log::${body}"

  # 画面を通した動作確認（E2E）: ローカルの Supabase（supabase start）に今のマイグレーションと商品データを入れ、
  # 本番ビルドのアプリを Playwright（スマホの画面サイズ）で操作する。AI 解析は e2e/mock-anthropic.mjs（モック）を使う。
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: |
          set -o pipefail
          # 設定ファイル（supabase/config.toml）は CI の中だけで作る（リポジトリには置かない）
          supabase init --force < /dev/null 2>&1 | tee supabase-start.log
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,postgres-meta 2>&1 | tee -a supabase-start.log
          supabase status -o env 2>/dev/null | grep -E '^[A-Z_]+=' > supabase.env
          set -a; source supabase.env; set +a
          echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}" >> "$GITHUB_ENV"
          echo "E2E_DB_URL=${DB_URL}" >> "$GITHUB_ENV"
      - name: Load food data
        run: psql "$E2E_DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/data/foods.sql 2>&1 | tee -a supabase-start.log
      - name: Install dependencies
        run: npm install --no-audit --no-fund 2>&1 | tee install.log
      - name: Build
        run: npm run build 2>&1 | tee build.log
      - name: Install Playwright
        run: |
          set -o pipefail
          npm install --no-save --no-audit --no-fund "@playwright/test@^1.55.0" 2>&1 | tee pw-install.log
          npx playwright install --with-deps chromium 2>&1 | tail -n 40 | tee -a pw-install.log
      - name: E2E tests
        env:
          ANTHROPIC_API_KEY: e2e-test-key
          ANTHROPIC_BASE_URL: http://127.0.0.1:4010
        run: |
          set -o pipefail
          node e2e/mock-anthropic.mjs > mock.log 2>&1 &
          npx next start -p 3000 -H 127.0.0.1 > app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/login && curl -sf -o /dev/null http://127.0.0.1:4010/health; then break; fi
            sleep 1
          done
          npx playwright test -c e2e/playwright.config.ts 2>&1 | tee e2e.log
      - name: Show failure details
        if: failure()
        run: |
          # 失敗したときはログの最後を注釈として残し、Actions の画面からすぐ読めるようにする
          for f in supabase-start.log install.log build.log pw-install.log e2e.log app.log mock.log; do
            [ -s "$f" ] || continue
            body=$(tail -n 120 "$f" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN { ORS = "%0A" } { print }')
            echo "::error title=${f}::${body}"
          done
